# Node64-Image bauen und nach GitHub Container Registry (ghcr.io/ipv64net/node64) schieben.
# Ausloeser: ein Versions-Tag (z. B. v0.12.0-alpha.1) oder von Hand (Actions › image › Run workflow).
# Vorher laufen vet und die Tests; schlagen sie fehl, entsteht kein Image.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag v0.12.0-alpha.1 -> 0.12.0-alpha.1; "latest" fuer jedes Versions-Tag (auch Alpha, Wunsch Dennis)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Selbst-Update: Programme je Architektur (wie im Image gebaut), Manifest und Signatur als Artefakt.
  # Ohne Secret NODE64_SIGNING_KEY wird nicht signiert (Artefakt ohne manifest.json.sig).
  # Hochladen nach https://ipv64.net/node64/releases/ (siehe docs/PLAN-SELF-UPDATE.md, Abschnitt Release).
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist/$V
          for a in amd64 arm64 armv7; do
            goarch=$a; goarm=""
            if [ "$a" = "armv7" ]; then goarch=arm; goarm=7; fi
            CGO_ENABLED=0 GOOS=linux GOARCH=$goarch GOARM=$goarm go build -trimpath -ldflags="-s -w -X main.Version=$V" -o dist/$V/node64-linux-$a ./cmd/node64
          done
          go run ./cmd/node64-release manifest -version "$V" -out dist/manifest.json dist/$V/node64-linux-*
      - name: sign
        env:
          NODE64_SIGNING_KEY: ${{ secrets.NODE64_SIGNING_KEY }}
        run: |
          if [ -n "$NODE64_SIGNING_KEY" ]; then go run ./cmd/node64-release sign dist/manifest.json; else echo "no signing key - manifest not signed"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: node64-release-${{ github.ref_name }}
          path: dist/
