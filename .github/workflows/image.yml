# Node64-Image bauen und nach GitHub Container Registry (ghcr.io/ipv64net/node64) schieben, dazu nach Docker Hub,
# sobald DOCKERHUB_IMAGE (Variable oder Secret) (z. B. ipv64net/node64) und die Secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN
# gesetzt sind (docs/RELEASE.md, Abschnitt Docker Hub). Ohne sie nur ghcr.io wie bisher.
# Ausloeser: ein Versions-Tag (z. B. v0.12.0-alpha.1) oder von Hand (Actions › image › Run workflow).
# Vorher laufen vet und die Tests; schlagen sie fehl, entsteht kein Image.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || secrets.DOCKERHUB_IMAGE }} # Variable oder Secret
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_IMAGE != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # leere Zeile (keine Docker-Hub-Variable) ignoriert die Action
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          # Tag v1.0.0 -> 1.0.0, 1.0, latest; Release-Candidate v1.0.1-rc.1 -> 1.0.1-rc.1, rc (latest nur fuer stabile Versionen)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=rc,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Beschreibung auf Docker Hub (docs/DOCKERHUB.md) nur bei stabilen Versionen; braucht ein Token mit
      # "Read, Write, Delete" (Read & Write reicht nur fuer die Images). Schlaegt das fehl, ist das Image trotzdem
      # veroeffentlicht; die Beschreibung dann einmal von Hand einfuegen.
      - uses: peter-evans/dockerhub-description@v4
        if: env.DOCKERHUB_IMAGE != '' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "Node64 by ipv64.net: health checks, reverse proxy, DNS filter, DynDNS, honeypot"
          readme-filepath: docs/DOCKERHUB.md

  # Selbst-Update: Programme je Architektur (wie im Image gebaut), Manifest und Signatur als Artefakt.
  # Ohne Secret NODE64_SIGNING_KEY wird nicht signiert (Artefakt ohne manifest.json.sig).
  # Hochladen nach https://ipv64.net/node64/releases/ (siehe docs/PLAN-SELF-UPDATE.md, Abschnitt Release).
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist/$V
          for a in amd64 arm64 armv7; do
            goarch=$a; goarm=""
            if [ "$a" = "armv7" ]; then goarch=arm; goarm=7; fi
            CGO_ENABLED=0 GOOS=linux GOARCH=$goarch GOARM=$goarm go build -trimpath -ldflags="-s -w -X main.Version=$V" -o dist/$V/node64-linux-$a ./cmd/node64
          done
          go run ./cmd/node64-release manifest -version "$V" -out dist/manifest.json dist/$V/node64-linux-*
      - name: sign
        env:
          NODE64_SIGNING_KEY: ${{ secrets.NODE64_SIGNING_KEY }}
        run: |
          if [ -n "$NODE64_SIGNING_KEY" ]; then go run ./cmd/node64-release sign dist/manifest.json; else echo "no signing key - manifest not signed"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: node64-release-${{ github.ref_name }}
          path: dist/
