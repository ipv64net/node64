{{define "content"}}
{{$d := .Data}}
<h1 class="h4 mb-3"><i class="bi bi-shield-check text-warning me-1"></i> {{.T "nf.verify_title"}}: {{$d.Name}} <span class="badge text-bg-light fs-6">{{.T (print "nf.type." $d.Type)}}</span></h1>
<div class="row g-3">
	<div class="col-lg-7">
		<div class="card">
			<div class="card-body">
				<p>{{.T "nf.verify_intro" "to" $d.To}}</p>
				<form method="post" action="/notifications/ipv64/{{$d.ID}}/verify/send" class="mb-3"><input type="hidden" name="_csrf" value="{{.CSRF}}">
					<button class="btn btn-outline-primary" type="submit"><i class="bi bi-send"></i> {{.T "nf.verify_send"}}</button></form>
				<form method="post" action="/notifications/ipv64/{{$d.ID}}/verify" class="d-flex flex-wrap gap-2 align-items-center"><input type="hidden" name="_csrf" value="{{.CSRF}}">
					<input class="form-control" style="max-width:10rem" name="code" inputmode="numeric" maxlength="8" placeholder="123456" aria-label="{{.T "nf.verify_code"}}" autocomplete="one-time-code" required>
					<button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> {{.T "nf.verify_check"}}</button>
					<a class="btn btn-outline-secondary" href="/notifications">{{.T "common.cancel"}}</a>
				</form>
			</div>
		</div>
	</div>
</div>
{{end}}
