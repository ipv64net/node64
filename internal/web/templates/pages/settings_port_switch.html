{{define "content"}}
{{$d := .Data}}
<div class="card" style="max-width: 36rem" id="port-switch" data-target="{{$d.Target}}">
	<div class="card-body">
		<h1 class="h5"><span class="spinner-border spinner-border-sm text-primary me-1" aria-hidden="true"></span> {{.T "settings.reach_switch_title"}}</h1>
		<p class="small text-body-secondary">{{.T "settings.reach_switch_text"}}</p>
		<p class="font-monospace text-break small">{{$d.Target}}</p>
		{{if $d.Bridge}}<p class="small text-body-secondary"><i class="bi bi-info-circle"></i> {{.T "settings.reach_bridge"}}</p>{{end}}
		<a class="btn btn-primary btn-sm" href="{{$d.Target}}"><i class="bi bi-box-arrow-up-right"></i> {{.T "settings.reach_switch_open"}}</a>
	</div>
</div>
{{end}}
