{{define "content"}}
{{$d := .Data}}
<div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
	<h1 class="h4 mb-0"><i class="bi bi-terminal-fill text-body-secondary me-1"></i> {{.T "logs.title"}}{{$.Doc "security#logs"}}{{.Doc "security#logs"}} <span class="badge text-bg-secondary">{{$d.Level}}</span></h1>
	<div>
		<a class="btn btn-outline-secondary btn-sm" href="/logs"><i class="bi bi-arrow-clockwise"></i> {{.T "logs.refresh"}}</a>
		<a class="btn btn-outline-secondary btn-sm" href="/logs/download"><i class="bi bi-download"></i> {{.T "logs.download"}}</a>
		<a class="btn btn-outline-secondary btn-sm" href="/settings#logging"><i class="bi bi-gear"></i> {{.T "settings.log_level"}}</a>
	</div>
</div>
<p class="text-body-secondary small">{{.T "logs.lines" "count" $d.Count}}</p>
<pre class="logbox border rounded p-2 small">{{range $d.Lines}}{{.}}
{{end}}</pre>
{{end}}
