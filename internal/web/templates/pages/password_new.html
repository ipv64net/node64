{{define "content"}}
<h1 class="h5 mb-3">{{.T "useradmin.must_change_title"}}</h1>
<p class="small text-body-secondary">{{.T "useradmin.must_change_intro" "name" (index .Data "Username")}}</p>
<form method="post" action="/login/password">
	<input type="hidden" name="_csrf" value="{{.CSRF}}">
	<input type="hidden" name="next" value="{{.Val "next"}}">
	<div class="mb-3">
		<label class="form-label" for="password">{{.T "settings.password_new"}}</label>
		<input class="form-control{{if .Err "password"}} is-invalid{{end}}" type="password" id="password" name="password" autocomplete="new-password" minlength="10" required autofocus>
		{{with .Err "password"}}<div class="invalid-feedback">{{.}}</div>{{else}}<div class="form-text">{{.T "setup.password_hint"}}</div>{{end}}
	</div>
	<div class="mb-3">
		<label class="form-label" for="password2">{{.T "setup.password_repeat"}}</label>
		<input class="form-control{{if .Err "password2"}} is-invalid{{end}}" type="password" id="password2" name="password2" autocomplete="new-password" minlength="10" required>
		{{with .Err "password2"}}<div class="invalid-feedback">{{.}}</div>{{end}}
	</div>
	<button class="btn btn-primary w-100" type="submit">{{.T "common.save"}}</button>
</form>
<form method="post" action="/logout" class="mt-3 text-center">
	<input type="hidden" name="_csrf" value="{{.CSRF}}">
	<button class="btn btn-link btn-sm" type="submit">{{.T "nav.logout"}}</button>
</form>
{{end}}
