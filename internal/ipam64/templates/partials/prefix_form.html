{{/* Formular eines Praefixes (Uebersicht: neu, Praefix-Seite: bearbeiten); .V = View, .F = Prefix */}}
{{define "ipam64_prefix_form"}}{{$v := .V}}{{$f := .F}}
<form method="post" action="/ipam64/prefix" class="row g-2">
	<input type="hidden" name="_csrf" value="{{$v.CSRF}}">
	<input type="hidden" name="uid" value="{{$f.UID}}">
	<input type="hidden" name="back" value="{{$f.Prefix}}">
	<div class="col-md-4"><label class="form-label small" for="ipam-p-prefix">{{$v.T "ipam64.col.prefix"}}</label>
		<input class="form-control form-control-sm font-monospace" id="ipam-p-prefix" name="prefix" value="{{$f.Prefix}}" placeholder="192.168.1.0/24 · fd00:10::/64" required maxlength="49">
		<div class="form-text">{{$v.T "ipam64.prefix.prefix_hint"}}</div></div>
	<div class="col-md-4"><label class="form-label small" for="ipam-p-name">{{$v.T "ipam64.col.name"}}</label><input class="form-control form-control-sm" id="ipam-p-name" name="name" value="{{$f.Name}}" maxlength="64"></div>
	<div class="col-6 col-md-2"><label class="form-label small" for="ipam-p-status">{{$v.T "ipam64.col.status"}}</label>
		<select class="form-select form-select-sm" id="ipam-p-status" name="status">
			{{range (split "active container reserved deprecated")}}<option value="{{.}}"{{if eq . $f.Status}} selected{{end}}>{{$v.T (print "ipam64.status." .)}}</option>{{end}}
		</select></div>
	<div class="col-6 col-md-2"><label class="form-label small" for="ipam-p-vlan">VLAN</label><input class="form-control form-control-sm" id="ipam-p-vlan" name="vlan" type="number" min="0" max="4094" value="{{if $f.VLAN}}{{$f.VLAN}}{{end}}"></div>
	<details class="col-12"{{if or $f.DNSZone $f.Role $f.Tags $f.Description $f.MarkFull (eq $f.Scan "off") (eq $f.Scan "active") (eq $f.DynSource "auto")}} open{{end}}>
		<summary class="small text-body-secondary">{{$v.T "ipam64.more"}}</summary>
		<div class="row g-2 mt-1">
			<div class="col-md-4"><label class="form-label small" for="ipam-p-zone">{{$v.T "ipam64.col.zone"}}</label><input class="form-control form-control-sm font-monospace" id="ipam-p-zone" name="dns_zone" value="{{$f.DNSZone}}" placeholder="home.lan" maxlength="253"></div>
			<div class="col-md-4"><label class="form-label small" for="ipam-p-role">{{$v.T "ipam64.col.role"}}</label><input class="form-control form-control-sm" id="ipam-p-role" name="role" value="{{$f.Role}}" maxlength="32" placeholder="{{$v.T "ipam64.prefix.role_ph"}}"></div>
			<div class="col-md-4"><label class="form-label small" for="ipam-p-scan">{{$v.T "ipam64.col.scan"}}</label>
				<select class="form-select form-select-sm" id="ipam-p-scan" name="scan">
					{{range (split "passive active off")}}<option value="{{.}}"{{if eq . $f.Scan}} selected{{end}}>{{$v.T (print "ipam64.scanmode." .)}}</option>{{end}}
				</select></div>
			<div class="col-md-6"><label class="form-label small" for="ipam-p-tags">{{$v.T "ipam64.col.tags"}}</label><input class="form-control form-control-sm" id="ipam-p-tags" name="tags" value="{{join $f.Tags " "}}" maxlength="330"></div>
			<div class="col-md-6"><label class="form-label small" for="ipam-p-desc">{{$v.T "ipam64.col.description"}}</label><input class="form-control form-control-sm" id="ipam-p-desc" name="description" value="{{$f.Description}}" maxlength="200"></div>
			<div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="ipam-p-full" name="mark_full" value="1"{{if $f.MarkFull}} checked{{end}}><label class="form-check-label small" for="ipam-p-full">{{$v.T "ipam64.prefix.mark_full"}}</label></div>
				<div class="form-check"><input class="form-check-input" type="checkbox" id="ipam-p-dyn" name="dynamic" value="1"{{if eq $f.DynSource "auto"}} checked{{end}}><label class="form-check-label small" for="ipam-p-dyn">{{$v.T "ipam64.prefix.dynamic"}}</label><div class="form-text">{{$v.T "ipam64.prefix.dynamic_hint"}}</div></div></div>
		</div>
	</details>
	<div class="col-12 d-flex gap-2"><button class="btn btn-sm btn-primary" type="submit">{{$v.T "common.save"}}</button></div>
</form>
{{end}}
