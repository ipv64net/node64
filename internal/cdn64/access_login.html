<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}} – {{HOST}}</title>
<style>
  :root{--bg:#f3f5f8;--card:#fff;--fg:#212529;--dim:#6c757d;--line:#dee2e6;--acc:#0d6efd;--acc2:#0b5ed7;--err:#dc3545;--errbg:#f8d7da}
  @media(prefers-color-scheme:dark){:root{--bg:#16191d;--card:#212529;--fg:#dee2e6;--dim:#9aa4ad;--line:#3a4048;--acc:#4d8dfd;--acc2:#3b7cf0;--err:#ea868f;--errbg:#2c0b0e}}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;
    display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:100%;max-width:380px}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px;color:var(--dim);font-size:13px;letter-spacing:.02em}
  .brand svg{width:28px;height:28px;fill:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 24px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
  h1{font-size:19px;font-weight:600;margin-bottom:4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px;word-break:break-all}
  label{display:block;font-size:13px;margin:0 0 5px}
  .in{display:flex;border:1px solid var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden;background:var(--card)}
  .in span{display:flex;align-items:center;padding:0 10px;background:rgba(127,127,127,.08);border-right:1px solid var(--line)}
  .in svg{width:16px;height:16px;fill:var(--dim)}
  .in input{flex:1;border:0;padding:10px 11px;font:inherit;color:var(--fg);background:transparent;outline:none;min-width:0}
  .in:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(13,110,253,.2)}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin:2px 0 18px}
  button{width:100%;border:0;border-radius:6px;background:var(--acc);color:#fff;font:inherit;font-weight:600;padding:11px;cursor:pointer}
  button:hover{background:var(--acc2)}
  .err{background:var(--errbg);color:var(--err);border-radius:6px;padding:9px 11px;font-size:13px;margin-bottom:16px}
  .foot{text-align:center;color:var(--dim);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a4 4 0 0 1 4 4v2h.5A1.5 1.5 0 0 1 14 7.5v7A1.5 1.5 0 0 1 12.5 16h-9A1.5 1.5 0 0 1 2 14.5v-7A1.5 1.5 0 0 1 3.5 6H4V4a4 4 0 0 1 4-4zm0 1.5A2.5 2.5 0 0 0 5.5 4v2h5V4A2.5 2.5 0 0 0 8 1.5zM8 9a1.5 1.5 0 0 0-.75 2.8V13h1.5v-1.2A1.5 1.5 0 0 0 8 9z"/></svg><span>{{HOST}}</span></div>
  <div class="card">
    <h1>{{TITLE}}</h1>
    <div class="sub">{{SUB}}</div>
    {{ERROR}}
    <form method="post" action="{{ACTION}}" autocomplete="on">
      <input type="hidden" name="list" value="{{LIST}}">
      <input type="hidden" name="next" value="{{NEXT}}">
      <label for="u">{{USER}}</label>
      <div class="in"><span><svg viewBox="0 0 16 16"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3z"/></svg></span><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus value="{{USERNAME}}"></div>
      <label for="p">{{PASS}}</label>
      <div class="in"><span><svg viewBox="0 0 16 16"><path d="M8 1a3 3 0 0 0-3 3v2h-.5A1.5 1.5 0 0 0 3 7.5v6A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5v-6A1.5 1.5 0 0 0 11.5 6H11V4a3 3 0 0 0-3-3zm2 5H6V4a2 2 0 1 1 4 0v2z"/></svg></span><input id="p" type="password" name="password" autocomplete="current-password" required></div>
      <label class="chk"><input type="checkbox" name="remember" value="1"> {{REMEMBER}}</label>
      <button type="submit">{{SUBMIT}}</button>
    </form>
  </div>
  <div class="foot">{{FOOT}}</div>
</div>
</body>
</html>
